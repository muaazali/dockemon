<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Minimalist Monogram: Continuous Vector Whale + Pokéball Button -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Whale Body Stroke -->
    <path d="
      M 100,280
      C 100,380 230,410 330,370
      C 410,338 430,270 440,230
      C 450,190 475,170 480,160
      C 460,168 440,175 430,170
      C 425,145 440,120 455,100
      C 430,115 410,140 390,175
      C 350,235 280,240 230,240
      L 120,240
      C 95,240 100,265 100,280 Z
    " fill="none" stroke="currentColor" stroke-width="20"/>

    <!-- Integrated Minimal Container Blocks -->
    <rect x="180" y="180" width="36" height="36" rx="6" fill="currentColor" opacity="0.65"/>
    <rect x="228" y="180" width="36" height="36" rx="6" fill="currentColor" opacity="0.65"/>
    <rect x="276" y="180" width="36" height="36" rx="6" fill="currentColor" opacity="0.65"/>

    <!-- Master Pokéball Circle Top -->
    <g transform="translate(228, 114)">
      <circle cx="24" cy="24" r="28" fill="none" stroke="currentColor" stroke-width="12"/>
      <circle cx="24" cy="24" r="10" fill="currentColor" opacity="0.75"/>
      <circle cx="24" cy="24" r="5" fill="currentColor"/>
    </g>

    <!-- Minimal Whale Eye -->
    <circle cx="140" cy="285" r="7" fill="currentColor" opacity="0.75"/>
  </g>
</svg>